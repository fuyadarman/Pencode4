name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Restore or Generate Debug & Release Keystores
      run: |
        if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "No debug.keystore.base64 found. Generating a default debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        if [ -f my-upload-key.jks.base64 ] && [ -s my-upload-key.jks.base64 ]; then
          echo "Restoring my-upload-key.jks from my-upload-key.jks.base64..."
          base64 -d my-upload-key.jks.base64 > my-upload-key.jks
        else
          echo "Generating Pencode release keystore..."
          keytool -genkey -v -keystore my-upload-key.jks -storepass fuyadheart6524 -alias upload -keypass fuyadheart6524 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mustasim Fuyad, OU=Pencode, O=pencode, L=Dinajpur, ST=rangpur, C=BD"
        fi

    - name: Create Placeholder Google Services JSON if missing
      run: |
        if [ ! -f app/google-services.json ]; then
          echo "Creating placeholder google-services.json to prevent build errors..."
          pkg=$(grep -oE 'applicationId\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$pkg" ]; then pkg="com.example"; fi
          echo "Extracted package name: $pkg"
          echo '{"project_info":{"project_number":"123456789012","project_id":"placeholder-id","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890abcdef","android_client_info":{"package_name":"'"$pkg"'"}},"api_key":[{"current_key":"placeholder_api_key"}],"services":{"appinvite_service":{"status":1}}}]}' > app/google-services.json
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build Signed Release & Debug APKs
      env:
        STORE_PASSWORD: fuyadheart6524
        KEY_PASSWORD: fuyadheart6524
        KEYSTORE_PATH: my-upload-key.jks
      run: gradle assembleRelease assembleDebug --no-daemon

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: pencode-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: pencode-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
